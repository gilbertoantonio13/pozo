<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Global de Pozo</title>
    
    <script src="https://unpkg.com/mqtt@4.3.0/dist/mqtt.min.js" type="text/javascript"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            margin-top: 0;
            padding: 0px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 0px;
            color: #1e293b;
            font-size: 1.8rem;
        }

        .dashboard {
            background: #ffffff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
        }

        .tank-container {
            position: relative;
            width: 150px;
            height: 260px;
            border: 5px solid #334155;
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin: 5px auto;
            background: #f1f5f9;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #0f172a, #2563eb);
            height: 0%; 
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -2px 10px rgba(37, 99, 235, 0.4);
        }

        .percentage-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 0px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0px;
            background-color: #fef3c7;
            color: #d97706;
            transition: all 0.3s ease;
        }
    
        /* --- ESTILOS PARA LAS ALERTAS --- */
        .danger-alert {
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.9rem;
            animation: parpadeo 1s infinite alternate;
        }

        /* Alerta de Desbordamiento (Roja) */
        .alert-high {
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #f87171;
        }

        /* Alerta de Vacío (Amarilla/Naranja) */
        .alert-low {
            background-color: #fef3c7;
            color: #92400e;
            border: 2px solid #fbbf24;
        }

        @keyframes parpadeo {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.7; transform: scale(0.98); }
        }

        /* Estados de color para el agua */
        .water.danger-high {
            background: linear-gradient(to top, #7f1d1d, #ef4444) !important;
            box-shadow: 0 -2px 15px rgba(239, 68, 68, 0.7);
        }

        .water.danger-low {
            background: linear-gradient(to top, #78350f, #f59e0b) !important;
            box-shadow: 0 -2px 15px rgba(245, 158, 11, 0.7);
        }

        .connected { background-color: #dcfce7; color: #15803d; }
        .disconnected { background-color: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <h1>Monitoreo de Pozo</h1>
    <p style="color: #64748b; margin-top: 0; margin-bottom: 20px;">Lectura Remota en Tiempo Real</p>
    
    <div class="dashboard">
        <div class="tank-container">
            <div id="waterLevel" class="water"></div>
        </div>
        <div id="percentageText" class="percentage-display">0%</div>
        <div id="connectionStatus" class="status-badge">Conectando a la red...</div>
        
        <div id="dangerAlert" class="danger-alert alert-high" style="display: none;">
            ⚠️ NIVEL CRÍTICO ⚠️<br>
            ¡Tanque a punto de desbordarse!
        </div>
        
        <div id="dangerAlert2" class="danger-alert alert-low" style="display: none;">
            ⚠️ NIVEL CRÍTICO ⚠️<br>
            ¡Tanque a punto de vaciarse!
        </div>
    </div>

<script>
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
        const TOPIC_LEER = "mi_proyecto_pozo/datos"; 
        
        const statusBadge = document.getElementById('connectionStatus');
        const waterLevel = document.getElementById('waterLevel');
        const percentageText = document.getElementById('percentageText');
        
        // CORRECCIÓN: Vinculamos las alertas a JavaScript
        const dangerAlert = document.getElementById('dangerAlert');
        const dangerAlert2 = document.getElementById('dangerAlert2');

        console.log("Conectando al servidor de alto rendimiento EMQX...");
        
        const client = mqtt.connect(BROKER_URL, {
            clientId: 'web_pozo_' + Math.random().toString(16).substr(2, 8),
            clean: true,
            connectTimeout: 5000
        });

        client.on('connect', () => {
            console.log("¡Conexión Exitosa con EMQX!");
            statusBadge.innerText = "Monitoreando en Vivo";
            statusBadge.className = "status-badge connected";
            client.subscribe(TOPIC_LEER, (err) => {
                if (!err) {
                    console.log("Suscrito al canal: " + TOPIC_LEER);
                }
            });
        });

        client.on('message', (topic, payload) => {
            try {
                const datos = JSON.parse(payload.toString());
                const porcentaje = datos.porcentaje;
                
                waterLevel.style.height = porcentaje + '%';
                percentageText.innerText = porcentaje + '%';
                console.log("Dato recibido: ", porcentaje);
    
                // --- NUEVA LÓGICA DE DETECCIÓN OPTIMIZADA ---
                if (porcentaje >= 95) {
                    // CASO 1: Tanque lleno (>= 95)
                    dangerAlert.style.display = 'block';
                    dangerAlert2.style.display = 'none';
                    
                    waterLevel.className = "water danger-high";
                    percentageText.style.color = '#b91c1c'; // Número en rojo
                    
                } else if (porcentaje < 10) {
                    // CASO 2: Tanque vacío (< 10)
                    dangerAlert.style.display = 'none';
                    dangerAlert2.style.display = 'block';
                    
                    waterLevel.className = "water danger-low";
                    percentageText.style.color = '#b45309'; // Número en naranja/amarillo
                    
                } else {
                    // CASO 3: Todo normal (Entre 10 y 94)
                    dangerAlert.style.display = 'none';
                    dangerAlert2.style.display = 'none';
                    
                    waterLevel.className = "water"; // Vuelve al azul original
                    percentageText.style.color = '#1e3a8a'; // Número en azul
                }

            } catch (e) {
                console.error("Error interpretando JSON:", e);
            }
        });

        client.on('error', (err) => {
            statusBadge.innerText = "Error: " + err.message;
            statusBadge.className = "status-badge disconnected";
        });

        client.on('close', () => {
            console.log("Conexión interrumpida.");
        });
    </script>
</body>
</html>
