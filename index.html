<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Global de Pozo</title>
    
    <script src="https://unpkg.com/mqtt@4.3.0/dist/mqtt.min.js" type="text/javascript"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: #1e293b;
            font-size: 1.8rem;
        }

        .dashboard {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
        }

        .tank-container {
            position: relative;
            width: 150px;
            height: 260px;
            border: 5px solid #334155;
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin: 25px auto;
            background: #f1f5f9;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #0f172a, #2563eb);
            height: 0%; 
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -2px 10px rgba(37, 99, 235, 0.4);
        }

        .percentage-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 10px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #fef3c7;
            color: #d97706;
            transition: all 0.3s ease;
        }

        .connected { background-color: #dcfce7; color: #15803d; }
        .disconnected { background-color: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <h1>Monitoreo de Pozo</h1>
    <p style="color: #64748b; margin-top: 0; margin-bottom: 20px;">Lectura Remota en Tiempo Real</p>
    
    <div class="dashboard">
        <div class="tank-container">
            <div id="waterLevel" class="water"></div>
        </div>
        <div id="percentageText" class="percentage-display">0%</div>
        <div id="connectionStatus" class="status-badge">Conectando a la red...</div>
    </div>

<script>
        // --- CAMBIO DE BROKER A EMQX (Seguro y compatible con navegadores) ---
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
        const TOPIC_LEER = "mi_proyecto_pozo/datos"; 
        
        const statusBadge = document.getElementById('connectionStatus');
        const waterLevel = document.getElementById('waterLevel');
        const percentageText = document.getElementById('percentageText');

        console.log("Conectando al servidor de alto rendimiento EMQX...");
        
        const client = mqtt.connect(BROKER_URL, {
            clientId: 'web_pozo_' + Math.random().toString(16).substr(2, 8),
            clean: true,
            connectTimeout: 5000
        });

        client.on('connect', () => {
            console.log("¡Conexión Exitosa con EMQX!");
            statusBadge.innerText = "Monitoreando en Vivo";
            statusBadge.className = "status-badge connected";
            client.subscribe(TOPIC_LEER, (err) => {
                if (!err) {
                    console.log("Suscrito al canal: " + TOPIC_LEER);
                }
            });
        });

        client.on('message', (topic, payload) => {
            try {
                const datos = JSON.parse(payload.toString());
                const porcentaje = datos.porcentaje;
                
                waterLevel.style.height = porcentaje + '%';
                percentageText.innerText = porcentaje + '%';
                console.log("Dato recibido: ", porcentaje);
            } catch (e) {
                console.error("Error interpretando JSON:", e);
            }
        });

        client.on('error', (err) => {
            statusBadge.innerText = "Error: " + err.message;
            statusBadge.className = "status-badge disconnected";
        });

        client.on('close', () => {
            console.log("Conexión interrumpida.");
        });
    </script>
</body>
</html>
