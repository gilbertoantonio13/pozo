<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Global de Pozo</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        /* --- ESTILOS VISUALES (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: #1e293b;
            font-size: 1.8rem;
        }

        .dashboard {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Contenedor del Tanque/Pozo */
        .tank-container {
            position: relative;
            width: 150px;
            height: 260px;
            border: 5px solid #334155;
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin: 25px auto;
            background: #f1f5f9;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        /* Animación y fluido del agua */
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #0f172a, #2563eb);
            height: 0%; /* Este porcentaje cambiará dinámicamente con los datos */
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -2px 10px rgba(37, 99, 235, 0.4);
        }

        /* Texto de porcentaje grande */
        .percentage-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 10px 0;
        }

        /* Indicador de estado de conexión */
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #fef3c7;
            color: #d97706;
            transition: all 0.3s ease;
        }

        .connected {
            background-color: #dcfce7;
            color: #15803d;
        }

        .disconnected {
            background-color: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>
<body>

    <h1>Monitoreo de Pozo</h1>
    <p style="color: #64748b; margin-top: 0; margin-bottom: 20px;">Lectura Remota en Tiempo Real</p>
    
    <div class="dashboard">
        <div class="tank-container">
            <div id="waterLevel" class="water"></div>
        </div>
        
        <div id="percentageText" class="percentage-display">0%</div>
        <div id="connectionStatus" class="status-badge">Conectando a la red...</div>
    </div>

    <script>
        // --- CONFIGURACIÓN DEL PUENTE EN LA NUBE (MQTT) ---
        const BROKER = "broker.hivemq.com";
        const PORT = 8014; // Puerto WebSocket indispensable para páginas web
        
        // Generamos una identificación única para la pestaña del navegador
        const CLIENT_ID = "web_pozo_client_" + Math.random().toString(16).substr(2, 8);
        
        // ⚠️ ATENCIÓN: Este canal DEBE SER IDÉNTICO al "topic_publicar" que le pusiste a tu ESP32
        const TOPIC_LEER = "mi_proyecto_pozo/datos"; 

        // Inicializamos el cliente que se conectará al servidor web remoto
        const client = new paho.MQTT.Client(BROKER, PORT, CLIENT_ID);

        // ¿Qué pasa si se pierde la conexión con el servidor intermedio?
        client.onConnectionLost = function (responseObject) {
            const statusBadge = document.getElementById('connectionStatus');
            statusBadge.innerText = "Desconectado de la nube";
            statusBadge.className = "status-badge disconnected";
        };

        // El momento clave: ¡Llegó un dato desde el pozo!
        client.onMessageArrived = function (message) {
            try {
                // Convertimos el texto JSON que mandó el ESP32 a un objeto legible por la web
                const datos = JSON.parse(message.payloadString);
                const porcentaje = datos.porcentaje;

                // Actualizamos la altura de la animación del cilindro
                document.getElementById('waterLevel').style.height = porcentaje + '%';
                
                // Actualizamos el número gigante en pantalla
                document.getElementById('percentageText').innerText = porcentaje + '%';
            } catch (error) {
                console.error("Error al interpretar los datos recibidos:", error);
            }
        };

// Intentar conectarse al servidor en la nube de forma segura y forzada
        client.connect({
            onSuccess: function () {
                const statusBadge = document.getElementById('connectionStatus');
                statusBadge.innerText = "Monitoreando en Vivo";
                statusBadge.className = "status-badge connected";
                
                // Nos suscribimos al canal del pozo
                client.subscribe(TOPIC_LEER);
            },
            onFailure: function (message) {
                // Si falla, te avisará en la pantalla el motivo real
                const statusBadge = document.getElementById('connectionStatus');
                statusBadge.innerText = "Fallo de conexión: " + message.errorMessage;
                statusBadge.className = "status-badge disconnected";
            },
            useSSL: true,
            timeout: 3,
            keepAliveInterval: 60,
            cleanSession: true
        });
    </script>
</body>
</html>
